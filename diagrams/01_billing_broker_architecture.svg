<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 940" width="1640" height="940">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .h1 { font-size: 20px; font-weight: 800; fill: #0f172a; letter-spacing: -0.01em; }
      .sub { font-size: 13px; font-weight: 500; fill: #475569; }
      .lane-title { font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; }
      .card-title { font-size: 14.5px; font-weight: 700; fill: #0f172a; }
      .card-code { font-size: 12px; font-weight: 600; fill: #1e293b; }
      .card-desc { font-size: 12px; font-weight: 500; fill: #475569; }
      .edge-lbl { font-size: 11.5px; font-weight: 600; fill: #334155; }
    </style>

    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arr-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1640" height="940" rx="16" class="bg"/>

  <!-- Header -->
  <text x="36" y="42" class="sans h1">Partner Billing Broker Platform — High-Level Reference Architecture (HLD v1.1)</text>
  <text x="36" y="64" class="sans sub">Zero Standing Customer Billing Privileges  •  1:1 Per-Tenant Linker SA Isolation  •  CRM v1 Ancestry Proof  •  &lt;10s Rogue Link Watchdog</text>
  <line x1="36" y1="80" x2="1604" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ==================== SWIMLANE 1: CUSTOMER ENVIRONMENT (Left, x=36, w=340) ==================== -->
  <rect x="36" y="102" width="340" height="802" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="56" y="130" class="sans lane-title" fill="#1d4ed8">1. Customer Environment</text>

  <!-- Card: Portal Admin -->
  <g transform="translate(56, 154)" filter="url(#shadow)">
    <rect width="300" height="128" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect width="300" height="8" rx="4" fill="#2563eb"/>
    <text x="16" y="34" class="sans card-title">Customer Admin (Mode A)</text>
    <text x="16" y="56" class="sans card-desc">Signs into Portal via Corporate SSO;</text>
    <text x="16" y="74" class="sans card-desc">runs 1-line gcloud command granting</text>
    <text x="16" y="94" class="mono card-code" fill="#1d4ed8">roles/billing.projectManager (30m TTL)</text>
    <text x="16" y="114" class="sans card-desc">Zero standing Partner footprint after 30m.</text>
  </g>

  <!-- Card: Terraform CI/CD -->
  <g transform="translate(56, 314)" filter="url(#shadow)">
    <rect width="300" height="128" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect width="300" height="8" rx="4" fill="#3b82f6"/>
    <text x="16" y="34" class="sans card-title">Customer CI/CD Pipeline (Mode B)</text>
    <text x="16" y="56" class="sans card-desc">GitHub Actions / GitLab / Terraform Cloud</text>
    <text x="16" y="74" class="sans card-desc">authenticates keyless via OIDC / WIF.</text>
    <text x="16" y="94" class="mono card-code" fill="#1d4ed8">billing_account = null on google_project</text>
    <text x="16" y="114" class="sans card-desc">Zero roles/billing.user in CI state!</text>
  </g>

  <!-- Card: Target GCP Project -->
  <g transform="translate(56, 540)" filter="url(#shadow)">
    <rect width="300" height="156" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect width="300" height="8" rx="4" fill="#0284c7"/>
    <text x="16" y="34" class="sans card-title">Target Customer GCP Project</text>
    <text x="16" y="58" class="mono card-code">organizations/CUSTOMER_ORG_ID</text>
    <text x="16" y="82" class="sans card-desc">• Inherits Customer Org Policies</text>
    <text x="16" y="100" class="sans card-desc">  (restrictServiceUsage, no SA keys)</text>
    <text x="16" y="118" class="sans card-desc">• Mode A: 30m expiring project binding</text>
    <text x="16" y="136" class="sans card-desc">• Mode B: Scoped to 1 Landing Folder</text>
  </g>

  <!-- Card: Velocity Burst & No-Org Block -->
  <g transform="translate(56, 730)" filter="url(#shadow)">
    <rect width="300" height="148" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect width="300" height="8" rx="4" fill="#d97706"/>
    <text x="16" y="34" class="sans card-title" fill="#92400e">Velocity Burst &amp; Policy Gates</text>
    <text x="16" y="58" class="sans card-desc">• Foreign Org or No-Org: HTTP 403 Block</text>
    <text x="16" y="76" class="sans card-desc">• Hourly Burst (&gt;Max/hr): Routed to</text>
    <text x="16" y="94" class="sans card-desc">  Partner FinOps Approval Workflow</text>
    <text x="16" y="118" class="mono card-code" fill="#b45309">HTTP 202 PENDING_FINOPS_APPROVAL</text>
  </g>

  <!-- ==================== SWIMLANE 2: PARTNER CONTROL PLANE (Center-Left, x=416, w=420) ==================== -->
  <rect x="416" y="102" width="420" height="538" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="436" y="130" class="sans lane-title" fill="#15803d">2. Partner Control Plane (broker-prod)</text>

  <!-- Card: Edge + Auth -->
  <g transform="translate(436, 154)" filter="url(#shadow)">
    <rect width="380" height="106" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect width="380" height="8" rx="4" fill="#16a34a"/>
    <text x="16" y="32" class="sans card-title">Cloud Armor WAF + HTTPS LB + Identity</text>
    <text x="16" y="54" class="sans card-desc">• Identity Platform (SAML/OIDC SSO) for Portal UI</text>
    <text x="16" y="72" class="sans card-desc">• Workload Identity Federation (OIDC) for CI/CD</text>
    <text x="16" y="90" class="mono card-code" fill="#15803d">Zero Static Partner API Keys</text>
  </g>

  <!-- Card: Broker Service -->
  <g transform="translate(436, 288)" filter="url(#shadow)">
    <rect width="380" height="162" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect width="380" height="8" rx="4" fill="#15803d"/>
    <text x="16" y="32" class="sans card-title">Billing Broker Orchestrator (Cloud Run v2)</text>
    <text x="16" y="56" class="sans card-desc">1. Enforces Idempotency-Key &amp; hourly link rate limit</text>
    <text x="16" y="74" class="sans card-desc">2. Mints 10m token for isolated Tenant Linker SA</text>
    <text x="16" y="92" class="sans card-desc">3. Verifies root Org ID via CRM v1 getAncestry</text>
    <text x="16" y="110" class="sans card-desc">4. Writes 90s LINKING lease before attaching billing</text>
    <text x="16" y="128" class="sans card-desc">5. Routes Velocity Burst (&gt;Max/hr) to FinOps gate</text>
    <text x="16" y="148" class="mono card-code" fill="#15803d">sa-broker-orchestrator (warm min-instances = 1)</text>
  </g>

  <!-- Card: Firestore Registry -->
  <g transform="translate(436, 478)" filter="url(#shadow)">
    <rect width="380" height="138" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect width="380" height="8" rx="4" fill="#0d9488"/>
    <text x="16" y="32" class="sans card-title">Firestore Native Registry &amp; Policy Store</text>
    <text x="16" y="56" class="mono card-code">tenants/{id}  •  link_requests/{id}</text>
    <text x="16" y="76" class="mono card-code">approved_project_bindings/{projectId}</text>
    <text x="16" y="98" class="sans card-desc">Stores allowed_org_ids, velocity caps, write-ahead</text>
    <text x="16" y="116" class="sans card-desc">leases, and PITR-protected binding audit records.</text>
  </g>

  <!-- ==================== SWIMLANE 2B: TENANT IDENTITY POOL (Bottom-Center, x=416, y=664, w=420) ==================== -->
  <rect x="416" y="664" width="420" height="240" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="436" y="692" class="sans lane-title" fill="#0f766e">3. Tenant Identity Pool (linkers-prod)</text>

  <g transform="translate(436, 712)" filter="url(#shadow)">
    <rect width="380" height="168" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    <rect width="380" height="8" rx="4" fill="#0d9488"/>
    <text x="16" y="32" class="sans card-title">1:1 Dedicated Per-Customer Linker SAs</text>
    <text x="16" y="54" class="mono card-code" fill="#0f766e">sa-linker-&lt;tenant&gt;@partner-billing-linkers...</text>
    <text x="16" y="78" class="sans card-desc">• Strictly 1 SA per Customer Billing Subaccount</text>
    <text x="16" y="96" class="sans card-desc">• Custom Role: PartnerSubaccountLinker</text>
    <text x="16" y="114" class="sans card-desc">  (create association + create budget ONLY)</text>
    <text x="16" y="132" class="sans card-desc">• delete &amp; setIamPolicy stripped (cannot unlink prod!)</text>
    <text x="16" y="150" class="sans card-desc">• Accessed only via 10m generateAccessToken</text>
  </g>

  <!-- ==================== SWIMLANE 4: GCP CONTROL PLANE APIs (Top-Right, x=876, w=728, h=402) ==================== -->
  <rect x="876" y="102" width="728" height="402" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="896" y="130" class="sans lane-title" fill="#334155">4. Google Cloud Control Plane APIs &amp; Partner Subaccounts</text>

  <!-- CRM v1 -->
  <g transform="translate(896, 154)" filter="url(#shadow)">
    <rect width="334" height="134" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="334" height="8" rx="4" fill="#475569"/>
    <text x="16" y="32" class="sans card-title">Cloud Resource Manager API v1</text>
    <text x="16" y="54" class="mono card-code">POST /v1/projects/{id}:getAncestry</text>
    <text x="16" y="78" class="sans card-desc">Returns full [project -&gt; folder -&gt; org] chain</text>
    <text x="16" y="96" class="sans card-desc">using only leaf projects.get permission</text>
    <text x="16" y="114" class="sans card-desc">(exponential backoff 1s..8s for Mode A).</text>
  </g>

  <!-- Cloud Billing & Budgets API -->
  <g transform="translate(1250, 154)" filter="url(#shadow)">
    <rect width="334" height="134" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="334" height="8" rx="4" fill="#475569"/>
    <text x="16" y="32" class="sans card-title">Cloud Billing &amp; Budgets APIs v1</text>
    <text x="16" y="54" class="mono card-code">PUT /v1/projects/{id}/billingInfo</text>
    <text x="16" y="74" class="mono card-code">POST /v1/{subaccount}/budgets</text>
    <text x="16" y="98" class="sans card-desc">Links validated project &amp; provisions baseline</text>
    <text x="16" y="116" class="sans card-desc">50% / 90% / 100% EUR spend alerts atomically.</text>
  </g>

  <!-- Partner Billing Subaccount -->
  <g transform="translate(896, 316)" filter="url(#shadow)">
    <rect width="688" height="164" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect width="688" height="8" rx="4" fill="#1e293b"/>
    <text x="20" y="34" class="sans card-title">Partner-Managed Customer Billing Subaccounts (Inside Partner GCP Org)</text>
    <text x="20" y="60" class="sans card-desc">• Customer Users &amp; FinOps: roles/billing.viewer ONLY (0 standing billing.user or billing.admin)</text>
    <text x="20" y="80" class="sans card-desc">• Partner Human Engineers: 0 standing billing.admin (PAM JIT 1h max + Dual Approval + Physical FIDO2 Keys Only)</text>
    <text x="20" y="100" class="sans card-desc">• Partner Org Policy: constraints/iam.allowedPolicyMemberDomains blocks @gmail.com consumer escalation</text>
    <text x="20" y="126" class="mono card-code" fill="#0f172a">Emits Real-Time Admin Activity Logs: UpdateProjectBillingInfo &amp; SetIamPolicy</text>
  </g>

  <!-- ==================== SWIMLANE 5: IMMUTABLE SECOPS WATCHDOG (Bottom-Right, x=876, y=534, w=728, h=370) ==================== -->
  <rect x="876" y="534" width="728" height="370" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="896" y="560" class="sans lane-title" fill="#b91c1c">5. Immutable SecOps Plane</text>

  <!-- Org Audit Sink + PubSub -->
  <g transform="translate(896, 578)" filter="url(#shadow)">
    <rect width="320" height="132" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <rect width="320" height="8" rx="4" fill="#ef4444"/>
    <text x="16" y="32" class="sans card-title">Org Aggregated Audit Sink + Pub/Sub</text>
    <text x="16" y="54" class="mono card-code">includeChildren = true</text>
    <text x="16" y="76" class="sans card-desc">Streams every UpdateProjectBillingInfo</text>
    <text x="16" y="94" class="sans card-desc">&amp; SetIamPolicy across all subaccounts in</text>
    <text x="16" y="112" class="sans card-desc">real time + Cloud Scheduler 15m Reconciler.</text>
  </g>

  <!-- Security Watchdog -->
  <g transform="translate(1244, 578)" filter="url(#shadow)">
    <rect width="340" height="298" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
    <rect width="340" height="8" rx="4" fill="#dc2626"/>
    <text x="16" y="32" class="sans card-title" fill="#991b1b">Two-Tier Security Watchdog (Cloud Run)</text>
    <text x="16" y="56" class="mono card-code" fill="#b91c1c">Tier 1A: Rogue / External Project Link</text>
    <text x="16" y="76" class="sans card-desc">No ACTIVE binding &amp; no valid LINKING lease:</text>
    <text x="16" y="94" class="sans card-desc">Auto-detaches billingAccountName="" in &lt;10s!</text>
    <line x1="16" y1="112" x2="324" y2="112" stroke="#fee2e2" stroke-width="1.5"/>
    <text x="16" y="134" class="mono card-code" fill="#b91c1c">Tier 1B: Rogue Billing SetIamPolicy</text>
    <text x="16" y="154" class="sans card-desc">Instant P1 SecOps page on @gmail / rogue admin.</text>
    <line x1="16" y1="172" x2="324" y2="172" stroke="#fee2e2" stroke-width="1.5"/>
    <text x="16" y="194" class="mono card-code" fill="#9a3412">Tier 2: Spend Spike on Approved Prod</text>
    <text x="16" y="214" class="sans card-desc">Safe Human/MSA Gate: P1 PagerDuty + 1-click</text>
    <text x="16" y="232" class="sans card-desc">unlink link (auto-kill only if MSA opted in).</text>
    <rect x="16" y="252" width="308" height="28" rx="6" fill="#fef2f2"/>
    <text x="170" y="270" text-anchor="middle" class="mono card-code" fill="#991b1b">DRY_RUN -&gt; Backfill -&gt; ENFORCE</text>
  </g>

  <!-- Alerting Bus -->
  <g transform="translate(896, 734)" filter="url(#shadow)">
    <rect width="320" height="142" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <rect width="320" height="8" rx="4" fill="#b91c1c"/>
    <text x="16" y="32" class="sans card-title">SecOps SIEM &amp; Essential Contacts</text>
    <text x="16" y="56" class="sans card-desc">• PagerDuty / Slack P1 Duty Escalation</text>
    <text x="16" y="76" class="sans card-desc">• Customer Essential Contacts Notification</text>
    <text x="16" y="96" class="sans card-desc">• Locked Immutable Audit Bucket / BigQuery</text>
    <text x="16" y="118" class="mono card-code" fill="#7f1d1d">15-Min Drift Reconciler Guard</text>
  </g>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Customer Admin & CI -> Edge -->
  <path d="M 356 207 L 428 207" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 356 368 L 392 368 L 392 225 L 428 225" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Edge -> Broker -->
  <line x1="626" y1="260" x2="626" y2="282" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- Broker <-> Firestore -->
  <line x1="626" y1="450" x2="626" y2="472" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- Firestore -> Linker SA (Impersonation from Broker via side channel) -->
  <path d="M 436 410 L 402 410 L 402 796 L 430 796" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- Linker SA -> CRM v1 & Billing API -->
  <path d="M 816 768 L 854 768 L 854 220 L 890 220" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <path d="M 854 220 L 854 142 L 1417 142 L 1417 148" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- Billing API -> Subaccount -->
  <line x1="1417" y1="288" x2="1417" y2="310" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-slate)"/>

  <!-- Subaccount -> Org Audit Sink (routed cleanly at x=1192 right of lane header) -->
  <line x1="1192" y1="480" x2="1192" y2="572" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Sink -> Watchdog -->
  <line x1="1216" y1="644" x2="1238" y2="644" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Watchdog -> Firestore Lease Check -->
  <path d="M 1244 688 L 1226 688 L 1226 516 L 822 516" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-slate)"/>
  <text x="900" y="510" class="sans edge-lbl">Verify Approved Binding / 90s Lease</text>

  <!-- Watchdog -> Emergency Unlink on Subaccount / Billing API -->
  <path d="M 1554 578 L 1554 486" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="1544" y="520" text-anchor="end" class="sans edge-lbl" fill="#b91c1c">Tier 1A Auto-Unlink (&lt;10s)</text>

  <!-- Watchdog -> Alerting Bus -->
  <line x1="1244" y1="805" x2="1222" y2="805" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>
</svg>
