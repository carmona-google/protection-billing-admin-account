<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 912" width="1580" height="912">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #334155; letter-spacing: 0.05em; }
      .sg-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.03em; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .pill-alert-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #be123c; }
    </style>

    <filter id="shadow" x="-4%" y="-6%" width="108%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dot" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10.5 6 L 1 10.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1580" height="912" rx="16" class="bg"/>

  <!-- Top Header -->
  <text x="40" y="36" class="header-title">PARTNER BILLING BROKER CONTROL PLANE — ARCHITECTURE &amp; KILL-SWITCH FLOW</text>
  <line x1="40" y1="50" x2="1540" y2="50" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- SUBGRAPH 1: CustomerEnv -->
  <rect x="40" y="68" width="880" height="140" rx="14" fill="#eff6ff" fill-opacity="0.65" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="93" class="sg-title" fill="#1d4ed8">Customer Environment (Customer GCP Org)</text>

  <!-- SUBGRAPH 2: PartnerControl -->
  <rect x="308" y="264" width="1176" height="278" rx="14" fill="#f1f5f9" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="332" y="290" class="sg-title" fill="#334155">Partner Billing Broker Control Plane (Partner GCP)</text>

  <!-- SUBGRAPH 3: PartnerIAM -->
  <rect x="308" y="592" width="516" height="114" rx="14" fill="#fffbeb" fill-opacity="0.75" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="332" y="617" class="sg-title" fill="#b45309">Tenant-Isolated Execution Layer</text>

  <!-- SUBGRAPH 4: GCPAPIs -->
  <rect x="164" y="762" width="1320" height="116" rx="14" fill="#ecfdf5" fill-opacity="0.7" stroke="#86efac" stroke-width="1.5"/>
  <text x="188" y="787" class="sg-title" fill="#047857">Google Cloud Control Plane APIs</text>

  <!-- ================= EDGES ================= -->

  <!-- CRM -.-> TargetProj (dotted, routed cleanly outside GCPAPIs box) -->
  <path d="M 192 831 L 128 831 L 128 194" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dot)"/>

  <!-- BillingAPI -.-> TargetProj (dotted, outer left lane) -->
  <path d="M 680 862 L 680 894 L 82 894 L 82 194" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dot)"/>

  <!-- Step 1: User --> AuthGW (lands right of PartnerControl title) -->
  <path d="M 680 190 L 680 308" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="485" y="220" width="390" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="680" y="236" text-anchor="middle" class="pill-text">1. Grant 30m TTL projectManager (Mode A) + Request Link</text>

  <!-- Step 2: AuthGW --> Orchestrator (shifted left so zero overlap with Step 3) -->
  <path d="M 442 388 L 442 444" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="354" y="404" width="176" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="442" y="420" text-anchor="middle" class="pill-text">2. Authenticated Request</text>

  <!-- Step 3: Orchestrator <--> PolicyDB -->
  <path d="M 696 486 L 746 486" fill="none" stroke="#475569" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="721" y1="428" x2="721" y2="486" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="562" y="404" width="290" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="707" y="420" text-anchor="middle" class="pill-text">3. Lookup Allowed Org IDs, Tiers &amp; Quotas</text>

  <!-- Step 4: Orchestrator --> TenantSA (lands right of PartnerIAM title) -->
  <path d="M 616 524 L 616 628" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="498" y="556" width="236" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="616" y="572" text-anchor="middle" class="pill-text">4. Impersonate Specific Tenant SA</text>

  <!-- Step 5: TenantSA --> CRM (lands right of GCPAPIs title) -->
  <path d="M 472 692 L 472 798" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="236" y="722" width="328" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="400" y="738" text-anchor="middle" class="pill-text">5. Verify Root Org ID == Allowed Customer Org</text>

  <!-- Step 6: TenantSA --> BillingAPI -->
  <path d="M 730 692 L 730 798" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="594" y="722" width="318" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="753" y="738" text-anchor="middle" class="pill-text">6. Link Project + Create Default Spend Budget</text>

  <!-- BillingAPI --> BillingSub -->
  <path d="M 1020 831 L 1062 831" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 7: BillingSub --> PubSubAudit -->
  <path d="M 1460 831 L 1542 831 L 1542 350 L 1462 350" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <g transform="translate(1542, 590) rotate(-90)">
    <rect x="-218" y="-12" width="436" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" class="pill-text">7. Admin Activity Logs (UpdateProjectBillingInfo / SetIamPolicy)</text>
  </g>

  <!-- PubSubAudit --> Watchdog -->
  <path d="M 1310 388 L 1310 444" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 8: Watchdog <--> PolicyDB -->
  <path d="M 1006 486 L 1058 486" fill="none" stroke="#475569" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="1032" y1="428" x2="1032" y2="486" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="876" y="404" width="372" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1062" y="420" text-anchor="middle" class="pill-text">8. Check Approved Registry; Auto-Unlink Rogue &lt;10s</text>

  <!-- Kill-Switch: Watchdog --> BillingAPI -->
  <path d="M 1190 524 L 1190 642 L 946 642 L 946 798" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="966" y="629" width="204" height="26" rx="13" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="1068" y="646.5" text-anchor="middle" class="pill-alert-text">Emergency Unlink / Alert</text>

  <!-- ================= NODES ================= -->

  <!-- TargetProj -->
  <g transform="translate(64, 110)" filter="url(#shadow)">
    <rect width="364" height="80" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <path d="M 10 0 L 354 0 Q 364 0 364 10 L 364 8 L 0 8 Q 0 0 10 0 Z" fill="#3b82f6"/>
    <text x="182" y="38" text-anchor="middle" class="node-title">Target GCP Project</text>
    <text x="182" y="60" text-anchor="middle" class="node-sub">(Inside Customer Org)</text>
  </g>

  <!-- User -->
  <g transform="translate(464, 110)" filter="url(#shadow)">
    <rect width="432" height="80" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <path d="M 10 0 L 422 0 Q 432 0 432 10 L 432 8 L 0 8 Q 0 0 10 0 Z" fill="#2563eb"/>
    <text x="216" y="38" text-anchor="middle" class="node-title">Customer Admin / DevOps</text>
    <text x="216" y="60" text-anchor="middle" class="node-sub">(Portal UI or Terraform CLI)</text>
  </g>

  <!-- AuthGW -->
  <g transform="translate(332, 310)" filter="url(#shadow)">
    <rect width="412" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 10 0 L 402 0 Q 412 0 412 10 L 412 8 L 0 8 Q 0 0 10 0 Z" fill="#6366f1"/>
    <text x="206" y="36" text-anchor="middle" class="node-title">API Gateway &amp; Portal UI</text>
    <text x="206" y="58" text-anchor="middle" class="node-sub">(OIDC / WIF + Workspace SSO)</text>
  </g>

  <!-- PubSubAudit -->
  <g transform="translate(1062, 310)" filter="url(#shadow)">
    <rect width="398" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 10 0 L 388 0 Q 398 0 398 10 L 398 8 L 0 8 Q 0 0 10 0 Z" fill="#0ea5e9"/>
    <text x="199" y="36" text-anchor="middle" class="node-title">Eventarc / PubSub</text>
    <text x="199" y="58" text-anchor="middle" class="node-sub">(Real-Time Billing Audit Stream)</text>
  </g>

  <!-- Orchestrator -->
  <g transform="translate(332, 446)" filter="url(#shadow)">
    <rect width="360" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 10 0 L 350 0 Q 360 0 360 10 L 360 8 L 0 8 Q 0 0 10 0 Z" fill="#4f46e5"/>
    <text x="180" y="36" text-anchor="middle" class="node-title">Billing Broker Service</text>
    <text x="180" y="58" text-anchor="middle" class="node-sub">(Cloud Run)</text>
  </g>

  <!-- PolicyDB (Cylinder) -->
  <g transform="translate(750, 441)" filter="url(#shadow)">
    <path d="M 0 12 A 126 10 0 0 1 252 12 L 252 76 A 126 10 0 0 1 0 76 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
    <ellipse cx="126" cy="12" rx="126" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="126" y="46" text-anchor="middle" class="node-title">Tenant &amp; Policy DB</text>
    <text x="126" y="66" text-anchor="middle" class="node-sub">(Firestore / Cloud SQL)</text>
  </g>

  <!-- Watchdog -->
  <g transform="translate(1062, 446)" filter="url(#shadow)">
    <rect width="398" height="78" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
    <path d="M 10 0 L 388 0 Q 398 0 398 10 L 398 8 L 0 8 Q 0 0 10 0 Z" fill="#e11d48"/>
    <text x="199" y="36" text-anchor="middle" class="node-title" fill="#881337">Security Reconciler &amp; Kill-Switch</text>
    <text x="199" y="58" text-anchor="middle" class="node-sub" fill="#9f1239">(Cloud Run)</text>
  </g>

  <!-- TenantSA -->
  <g transform="translate(332, 630)" filter="url(#shadow)">
    <rect width="468" height="62" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
    <path d="M 10 0 L 458 0 Q 468 0 468 10 L 468 8 L 0 8 Q 0 0 10 0 Z" fill="#f59e0b"/>
    <text x="234" y="30" text-anchor="middle" class="node-title">Per-Customer Linker SA</text>
    <text x="234" y="50" text-anchor="middle" class="node-sub">(1 SA per Subaccount)</text>
  </g>

  <!-- CRM -->
  <g transform="translate(192, 800)" filter="url(#shadow)">
    <rect width="376" height="62" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <path d="M 10 0 L 366 0 Q 376 0 376 10 L 376 8 L 0 8 Q 0 0 10 0 Z" fill="#10b981"/>
    <text x="188" y="30" text-anchor="middle" class="node-title">Cloud Resource Manager API</text>
    <text x="188" y="50" text-anchor="middle" class="node-sub">(projects.getAncestry)</text>
  </g>

  <!-- BillingAPI -->
  <g transform="translate(608, 800)" filter="url(#shadow)">
    <rect width="412" height="62" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <path d="M 10 0 L 402 0 Q 412 0 412 10 L 412 8 L 0 8 Q 0 0 10 0 Z" fill="#059669"/>
    <text x="206" y="30" text-anchor="middle" class="node-title">Cloud Billing API</text>
    <text x="206" y="50" text-anchor="middle" class="node-sub">(updateBillingInfo &amp; Budgets)</text>
  </g>

  <!-- BillingSub -->
  <g transform="translate(1064, 800)" filter="url(#shadow)">
    <rect width="396" height="62" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <path d="M 10 0 L 386 0 Q 396 0 396 10 L 396 8 L 0 8 Q 0 0 10 0 Z" fill="#047857"/>
    <text x="198" y="30" text-anchor="middle" class="node-title">Customer Billing Subaccount</text>
    <text x="198" y="50" text-anchor="middle" class="node-sub">(roles/billing.viewer to Customer)</text>
  </g>
</svg>
